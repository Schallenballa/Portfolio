sonar.projectKey=Schallenballa_Portfolio
sonar.organization=zachary-schallenberger-portfolio

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=Portfolio
#sonar.projectVersion=1.0


# Analyze application and build-script code, and classify Jest files as tests.
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/tests/**/*.js,src/setupTests.js

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.exclusions=vanilla-site/**,netlify/**,src/**/*.test.js,src/**/tests/**/*.js,src/setupTests.js
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
